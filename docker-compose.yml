services:
  node-red:
    image: "nodered/node-red"
    restart: always
    user: root
    ports:
      - "1890:1880"
    volumes:
      - ./data:/data
      -  ../node-red-contrib-dongtien:/workspace/node-red-contrib-dongtien
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"

  influxdb:
    image: "influxdb:1.8.3"
    restart: always
    ports:
      - "8090:8086"
      - "8088:8088"
    volumes:
      - "./influxdb:/etc/influxdb"
      - "influx-data:/var/lib/influxdb"
    environment:
      - INFLUXDB_BIND_ADDRESS=:8088
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"

  renderer:
    image: grafana/grafana-image-renderer:latest
    restart: always
    container_name: renderer
    environment:
      - AUTH_TOKEN=mind
      - RENDERING_TIMEOUT=30
      - HTTP_TIME_ZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"

  grafana:
    image: "grafana/grafana"
    restart: always
    ports:
      - "3090:3000"
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./grafana:/etc/grafana"
      - "./grafana/dashboards:/var/lib/grafana/dashboards"
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:3090
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=mind
      - GF_RENDERING_CLUSTERING_TIMEOUT=60
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      - renderer
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"

  eclipse-mosquitto:
    image: "eclipse-mosquitto:latest"
    restart: always
    ports:
      - "1893:1883"
      - "9091:9001"
    volumes:
      - "./eclipse_mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf"
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"

volumes:
  influx-data:
  grafana-data: